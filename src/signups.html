title: Course Sign-ups | Empowered Health
description: Private staff page.
path: signups/index.html
robots: noindex, nofollow

<section class="hero small">
  <div class="wrap">
    <div class="eyebrow">Staff only</div>
    <h1>Course sign-ups</h1>
    <p>Everyone who signed up for the free provider courses.</p>
  </div>
</section>

<section>
  <div class="wrap">
    <form class="join-form login" id="login" novalidate>
      <h3 style="margin:0">Staff sign in</h3>
      <div class="field"><label for="lemail">Email</label><input id="lemail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password" required></div>
      <p class="form-error" id="lerr" role="alert" hidden></p>
      <button class="btn" type="submit" id="lgo">Sign in</button>
    </form>

    <div id="app" hidden>
      <div class="su-bar">
        <div class="field su-search"><label for="q">Search</label><input id="q" type="search" placeholder="Name, email, phone or role"></div>
        <div class="su-actions">
          <button class="btn" type="button" id="csv">Download for Excel</button>
          <button class="btn ghost" type="button" id="refresh">Refresh</button>
          <button class="btn ghost" type="button" id="out">Sign out</button>
        </div>
      </div>
      <p class="su-count" id="count"></p>
      <div class="su-table">
        <table class="lab-table">
          <thead><tr><th>Signed up</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>First page</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="form-error" id="aerr" role="alert" hidden></p>
    </div>
  </div>
</section>

<script>
(function () {
  var SB_URL = "{supabase_url}", SB_KEY = "{supabase_key}";
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "ehStaffSession", data = [], pendingDelete = null;
  function session() { try { return JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
  function save(s) { try { s ? sessionStorage.setItem(KEY, JSON.stringify(s)) : sessionStorage.removeItem(KEY); } catch (e) {} }
  function show(err, msg) { err.textContent = msg; err.hidden = !msg; }
  function api(path, opts) {
    var s = session();
    opts = opts || {};
    opts.headers = Object.assign({ apikey: SB_KEY }, s ? { Authorization: "Bearer " + s.access_token } : {}, opts.headers || {});
    return fetch(SB_URL + path, opts).then(function (r) {
      if (r.status === 401) { save(null); render(); throw new Error("Your sign-in expired. Please sign in again."); }
      if (!r.ok) throw new Error("Something went wrong (" + r.status + "). Please try again.");
      return r.status === 204 ? null : r.json();
    });
  }
  function render() {
    var signedIn = !!session();
    $("login").hidden = signedIn; $("app").hidden = !signedIn;
    if (signedIn) load();
  }
  function fmt(t) { var d = new Date(t); return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function draw() {
    var q = $("q").value.trim().toLowerCase();
    var list = data.filter(function (r) {
      return !q || [r.first_name, r.last_name, r.email, r.phone, r.role].join(" ").toLowerCase().indexOf(q) > -1;
    });
    $("count").textContent = list.length + " of " + data.length + " sign-ups";
    var tb = $("rows"); tb.textContent = "";
    list.forEach(function (r) {
      var tr = document.createElement("tr");
      [fmt(r.created_at), r.first_name + " " + r.last_name, r.email, r.phone, r.role, r.page || ""].forEach(function (v, i) {
        var td = document.createElement("td");
        if (i === 2) { var a = document.createElement("a"); a.href = "mailto:" + v; a.textContent = v; td.appendChild(a); }
        else if (i === 3) { var b = document.createElement("a"); b.href = "tel:" + v.replace(/[^\d+]/g, ""); b.textContent = v; td.appendChild(b); }
        else td.textContent = v;
        tr.appendChild(td);
      });
      var tdx = document.createElement("td"), del = document.createElement("button");
      del.type = "button"; del.className = "su-del";
      del.textContent = pendingDelete === r.id ? "Confirm delete" : "Delete";
      del.addEventListener("click", function () {
        if (pendingDelete !== r.id) { pendingDelete = r.id; draw(); return; }
        api("/rest/v1/course_signups?id=eq." + r.id, { method: "DELETE" })
          .then(function () { pendingDelete = null; data = data.filter(function (x) { return x.id !== r.id; }); draw(); })
          .catch(function (e) { show($("aerr"), e.message); });
      });
      tdx.appendChild(del); tr.appendChild(tdx); tb.appendChild(tr);
    });
  }
  function load() {
    show($("aerr"), "");
    api("/rest/v1/course_signups?select=*&order=created_at.desc&limit=10000")
      .then(function (rows) {
        data = rows || [];
        draw();
        if (!data.length) $("count").textContent = "No sign-ups yet. If you expected some, check that your email is on the staff list in Supabase.";
      })
      .catch(function (e) { show($("aerr"), e.message); });
  }
  $("login").addEventListener("submit", function (e) {
    e.preventDefault();
    show($("lerr"), "");
    if (!SB_URL || !SB_KEY) return show($("lerr"), "The sign-ups database isn't connected yet.");
    $("lgo").disabled = true;
    fetch(SB_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SB_KEY },
      body: JSON.stringify({ email: $("lemail").value.trim(), password: $("lpass").value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        $("lgo").disabled = false;
        if (!res.ok || !res.j.access_token) return show($("lerr"), "That email and password didn't work. Please try again.");
        $("lpass").value = "";
        save({ access_token: res.j.access_token });
        render();
      })
      .catch(function () { $("lgo").disabled = false; show($("lerr"), "We couldn't reach the database. Check your connection and try again."); });
  });
  $("q").addEventListener("input", draw);
  $("refresh").addEventListener("click", load);
  $("out").addEventListener("click", function () { save(null); data = []; render(); });
  $("csv").addEventListener("click", function () {
    var cols = ["created_at", "first_name", "last_name", "email", "phone", "role", "page"];
    var esc = function (v) { v = v == null ? "" : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    var csv = [cols.join(",")].concat(data.map(function (r) { return cols.map(function (c) { return esc(r[c]); }).join(","); })).join("\r\n");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = "course-signups-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });
  render();
})();
</script>
